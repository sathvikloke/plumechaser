[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumechaser"
version = "0.1.0"
description = "Open autonomous methane super-emitter monitoring: TROPOMI screening -> Sentinel-2/Landsat MBMP retrieval -> IME quantification -> catalog agreement study."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PlumeChaser Team" }]
keywords = ["methane", "remote-sensing", "TROPOMI", "Sentinel-2", "super-emitters"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
data = ["xarray>=2024.1", "h5netcdf>=1.3", "netcdf4>=1.6"]
gee = ["earthengine-api>=0.1.400"]
cds = ["cdsapi>=0.7"]
ml = ["torch>=2.2"]
viz = ["streamlit>=1.35", "matplotlib>=3.8"]
all = ["plumechaser[dev,data,gee,cds,ml,viz]"]

[project.scripts]
plumechaser = "plumechaser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["N806"]  # scientific code uses uppercase matrix names

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
